<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071827" />
    <meta name="description" content="Megatron-LM research presentation with inspectable teaching animations and original paper figures." />
    <title>Megatron-LM Teaching Presentation</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23071827'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='30' fill='%237de5d6'%3EM%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="presentation" aria-label="Megatron-LM presentation">
      <div id="stage-shell">
        <div id="stage" aria-live="polite"></div>
      </div>
      <button id="previous-slide" class="page-arrow left" type="button" aria-label="Previous slide" title="Previous slide (left arrow)">‹</button>
      <button id="next-slide" class="page-arrow right" type="button" aria-label="Next slide" title="Next slide (right arrow)">›</button>
      <div id="page-status" aria-label="Current slide"></div>
      <button id="fullscreen" type="button" aria-label="Toggle fullscreen" title="Toggle fullscreen">⛶</button>
    </main>
    <dialog id="figure-modal" aria-label="Original paper figure">
      <button id="close-figure" type="button" aria-label="Close figure">×</button>
      <img id="figure-full" alt="" />
      <p id="figure-caption"></p>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
